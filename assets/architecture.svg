<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Utilities Medallion Architecture</title><desc id="desc">Raw utility data travels through Airflow, Bronze, Silver and Gold before optional BigQuery and Looker Studio consumption.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081426"/><stop offset="1" stop-color="#102e49"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6z" fill="#7dd3fc"/></marker></defs>
  <rect width="1200" height="420" rx="24" fill="url(#bg)"/><text x="60" y="70" fill="white" font-family="Arial, sans-serif" font-size="30" font-weight="700">Utilities Data Platform</text><text x="60" y="102" fill="#bae6fd" font-family="Arial, sans-serif" font-size="16">Local-first Medallion architecture with optional cloud serving</text>
  <g font-family="Arial, sans-serif" text-anchor="middle"><g fill="none" stroke="#7dd3fc" stroke-width="3" marker-end="url(#arrow)"><path d="M185 220H250"/><path d="M355 220H420"/><path d="M525 220H590"/><path d="M695 220H760"/><path d="M865 220H930"/><path d="M1035 220H1090"/></g>
  <g><rect x="65" y="165" width="120" height="110" rx="14" fill="#0e7490"/><text x="125" y="205" fill="white" font-size="28">☁</text><text x="125" y="240" fill="white" font-size="15" font-weight="700">Source</text><text x="125" y="260" fill="#cffafe" font-size="12">CSV landing</text></g>
  <g><rect x="250" y="165" width="105" height="110" rx="14" fill="#2563eb"/><text x="302" y="205" fill="white" font-size="24">⚙</text><text x="302" y="240" fill="white" font-size="15" font-weight="700">Airflow</text><text x="302" y="260" fill="#dbeafe" font-size="12">Orchestration</text></g>
  <g><rect x="420" y="165" width="105" height="110" rx="14" fill="#b45309"/><text x="472" y="240" fill="white" font-size="15" font-weight="700">Bronze</text><text x="472" y="260" fill="#fef3c7" font-size="12">Raw + metadata</text></g>
  <g><rect x="590" y="165" width="105" height="110" rx="14" fill="#64748b"/><text x="642" y="240" fill="white" font-size="15" font-weight="700">Silver</text><text x="642" y="260" fill="#f1f5f9" font-size="12">Quality rules</text></g>
  <g><rect x="760" y="165" width="105" height="110" rx="14" fill="#ca8a04"/><text x="812" y="240" fill="white" font-size="15" font-weight="700">Gold</text><text x="812" y="260" fill="#fef9c3" font-size="12">Business metrics</text></g>
  <g><rect x="930" y="165" width="105" height="110" rx="14" fill="#1d4ed8"/><text x="982" y="240" fill="white" font-size="15" font-weight="700">BigQuery</text><text x="982" y="260" fill="#dbeafe" font-size="12">Optional serving</text></g>
  <g><rect x="1090" y="165" width="85" height="110" rx="14" fill="#7c3aed"/><text x="1132" y="240" fill="white" font-size="14" font-weight="700">Looker</text><text x="1132" y="260" fill="#ede9fe" font-size="12">BI</text></g></g>
  <text x="60" y="360" fill="#94a3b8" font-family="Arial, sans-serif" font-size="14">CDC uses stable SHA-256 record hashes and a local checkpoint. Gold artifacts are written atomically.</text>
</svg>
