# docker-compose.yaml
# Setup ENXUTO do Airflow com LocalExecutor.
# Diferente do docker-compose "oficial" do Airflow (que usa CeleryExecutor
# e sobe 6-7 containers, exigindo bastante RAM), esse aqui usa só 2 serviços
# além do init: Postgres (metadata) + Webserver + Scheduler.
# Ideal pra rodar num notebook comum sem travar a máquina.

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3
  environment:
    # Sobrescreve o cálculo relativo de paths em src/common/paths.py —
    # necessário porque src/ é montado dentro de dags/ no container,
    # em profundidade diferente da estrutura local do projeto.
    PIPELINE_DATA_DIR: /opt/airflow/data
    # LocalExecutor = as tasks rodam como processos locais no mesmo container
    # do scheduler. Não precisa de Redis/Celery/Workers separados.
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'   # não carrega as DAGs de exemplo do Airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: 'true'
    AIRFLOW__CORE__DEFAULT_TIMEZONE: 'America/Sao_Paulo'
    # Menos workers e mais tempo de timeout = menos memória consumida.
    # O padrão do Airflow é 4 workers, o que pesa demais em máquinas com
    # Docker Desktop configurado com pouca RAM (comum no Windows/WSL2).
    AIRFLOW__WEBSERVER__WORKERS: '2'
    AIRFLOW__WEBSERVER__WORKER_REFRESH_BATCH_SIZE: '1'
    AIRFLOW__WEBSERVER__WEB_SERVER_WORKER_TIMEOUT: '300'
    # Pacotes extras instalados automaticamente no container (pandas, cliente do BigQuery etc)
    _PIP_ADDITIONAL_REQUIREMENTS: ${_PIP_ADDITIONAL_REQUIREMENTS:-pandas numpy matplotlib google-cloud-bigquery db-dtypes}
  volumes:
    # Aqui é a mágica: essas pastas do seu PC "aparecem" dentro do container.
    # O Airflow lê as DAGs, mas quem processa os dados de verdade é o Python
    # que está em ./src, chamado a partir da DAG.
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/dags/src
    - ./data:/opt/airflow/data
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
    # Chave de serviço do GCP (você vai gerar essa no console do GCP e
    # NUNCA subir pro GitHub — já está no .gitignore)
    - ./gcp-key.json:/opt/airflow/gcp-key.json:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  # Banco de metadados do Airflow: guarda histórico de execuções, status
  # de tasks, conexões, variáveis. NÃO é onde ficam os dados do seu pipeline.
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-db-volume:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    restart: always

  # Roda uma vez só: cria as tabelas do banco e o usuário admin da interface web.
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin \
          --firstname Arthur \
          --lastname Oliveira \
          --role Admin \
          --email admin@example.com \
          --password admin || true
        # "|| true" torna o comando idempotente: se o usuário admin já
        # existir (porque o init já rodou antes), ele só avisa e segue
        # em frente, em vez de fazer o container falhar.

  # Interface web (http://localhost:8080) onde você vê as DAGs, liga/desliga,
  # dispara execuções manuais e acompanha logs.
  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      # Formato "porta_da_sua_maquina:porta_do_container".
      # Trocamos a porta da esquerda pra 8081 pra não brigar com o
      # Apache que já ocupa a 8080 na sua máquina. A porta DE DENTRO
      # do container continua 8080 (é onde o Airflow escuta por padrão),
      # só o "endereço externo" muda.
      - "8081:8080"
    restart: always
    depends_on:
      - airflow-init

  # O "cérebro" que decide quando cada DAG deve rodar, baseado no schedule
  # definido no código da DAG.
  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      - airflow-init

volumes:
  postgres-db-volume:
